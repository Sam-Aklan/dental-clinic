services:
  postgres:
    image: postgres:15-alpine
    container_name: dental-postgres
    env_file:
      - backend/.env.example
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5435"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dental"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dental-redis
    env_file:
      - backend/.env.example
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dental-mailhog
    env_file:
      - backend/.env.example
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
